name: Keystore Uret
on: workflow_dispatch
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          [ -n "$KS_PASS" ] || { echo "HATA: KS_PASS secret bos"; exit 1; }
          [ -n "$KS_ALIAS" ] || { echo "HATA: KS_ALIAS secret bos"; exit 1; }
          keytool -genkeypair -keystore release.keystore -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Ganyan Sosyal, O=Ganyan Sosyal, C=TR"
          echo '### Parmak izleri' >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore release.keystore -alias "$KS_ALIAS" -storepass "$KS_PASS" | grep -E "SHA1|SHA256" >> $GITHUB_STEP_SUMMARY
          echo '### KS_BASE64 (sadece asagidaki tek satir)' >> $GITHUB_STEP_SUMMARY
          base64 -w0 release.keystore >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
