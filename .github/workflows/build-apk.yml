name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android projesini üret
        run: |
          flutter create --platforms=android --org com.ganyansosyal --project-name ganyansosyal_native .
          git checkout -- pubspec.yaml lib/main.dart
          rm -rf test

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ganyansosyal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
