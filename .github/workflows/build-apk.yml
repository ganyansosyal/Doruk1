name: APK derle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android projesini üret
        run: |
          flutter create --platforms=android --org com.ganyansosyal --project-name ganyansosyal_native .
          git checkout -- pubspec.yaml lib/main.dart
          rm -rf test
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Kupon görselini galeriye kaydetmek için (Android 9 ve altı)
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Impeller çizim motoru bazı telefonlarda kaydırmada takılıyor: kapat
          sed -i 's#</application>#    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="GanyanSosyal"#' android/app/src/main/AndroidManifest.xml
          # Firebase eklentileri en az Android 6 (API 23) ister
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 23)/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion Math.max(flutter.minSdkVersion, 23)/' android/app/build.gradle 2>/dev/null || true

      - run: flutter pub get

      - name: Uygulama simgesini üret
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ganyansosyal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
