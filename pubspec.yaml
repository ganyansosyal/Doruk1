name: ganyansosyal_native
description: GanyanSosyal native uygulama
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  image_picker: any
  http: ^1.2.0
  html: ^0.15.4
  url_launcher: ^6.2.0
  path_provider: ^2.1.0
  video_player: ^2.9.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0E7C5B"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true
